<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS INLINE</title>
    <style>
		* {
			font-family:"arial";
		}
		</style>
</head>
<body>
    <!-- Para usar CSS inline, utilizamos em cada tag o atributo style com as propriedades. -->

    <h1 style="color:crimson;text-align: center;">Usando CSS direto na tag (inline)</h1>

    <p style="font-size: 30px; font-style: italic;">
        Este é um texto qualquer e etc e tal</p>
    <p>E aqui é outro texto qualquer</p>

    <hr>

    <h2>um sub qualque ranha</h2>

    <p>blabla ranha</p>

</body>
</html>
